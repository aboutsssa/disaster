<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 801 497" role="img" aria-labelledby="title desc">
  <title id="title">Typology of Post-Disaster Recovery Trajectories</title>
  <desc id="desc">Four recovery trajectories organized by material reconstruction and relational reassembly.</desc>
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.title{font-size:21px;font-weight:800;fill:#20272a}.sub{font-size:12px;font-style:italic;fill:#5d6668}.axis{font-size:13px;font-weight:800;fill:#20272a}.note{font-size:10.5px;fill:#4f5a5c}.qtitle{font-size:16px;font-weight:800}.qsub{font-size:11px;font-style:italic;font-weight:700}.body{font-size:10.5px;fill:#263033}.italic{font-size:10.5px;font-style:italic;fill:#4e585a}.small{font-size:10px;font-weight:800}.hi{fill:#2f7a39}.lo{fill:#c53d3c}.blue{fill:#19558b}.green{fill:#2f7138}.red{fill:#b9433e}.orange{fill:#d2721f}.purple{fill:#72519c}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#20272a"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1d2528" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="801" height="497" fill="#fff"/>
  <g class="sans">
    <text x="432" y="29" text-anchor="middle" class="title">Typology of Post-Disaster Recovery Trajectories</text>
    <text x="432" y="47" text-anchor="middle" class="sub">Recovery outcomes as a function of material reconstruction</text>
    <text x="432" y="63" text-anchor="middle" class="sub">and relational reassembly across four dimensions of re-inhabitability</text>
  </g>

  <g class="sans">
    <text x="23" y="93" class="axis">Degree of</text>
    <text x="23" y="110" class="axis">Relational</text>
    <text x="23" y="127" class="axis">Reassembly</text>
    <text x="23" y="153" class="note">(across four</text>
    <text x="23" y="168" class="note">dimensions of</text>
    <text x="23" y="183" class="note">re-inhabitability)</text>
    <text x="122" y="91" text-anchor="middle" class="small hi">High</text>
    <text x="122" y="430" text-anchor="middle" class="small lo">Low</text>
    <text x="246" y="469" text-anchor="middle" class="small lo">Low</text>
    <text x="739" y="469" text-anchor="middle" class="small hi">High</text>
    <text x="492" y="461" text-anchor="middle" class="axis">Degree of Material Reconstruction</text>
    <text x="492" y="478" text-anchor="middle" class="note">(infrastructure, housing, services, economic systems)</text>
  </g>

  <g stroke="#1f292c" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M151 436V78"/>
    <path d="M151 252H771"/>
    <path d="M436 436V78"/>
  </g>

  <g class="sans">
    <circle cx="52" cy="209" r="18" fill="#e7f2fb" stroke="#2f72b7" stroke-width="2"/>
    <circle cx="44" cy="207" r="5" fill="#2f72b7"/><circle cx="53" cy="204" r="5" fill="#2f72b7"/><circle cx="61" cy="207" r="5" fill="#2f72b7"/><path d="M38 221c5-11 25-11 30 0" fill="#2f72b7"/>
    <text x="86" y="207" class="small blue">Social</text><text x="86" y="222" class="small blue">relations</text>
    <circle cx="52" cy="266" r="18" fill="#edf8ed" stroke="#3c853c" stroke-width="2"/><path d="M52 253c11 10 10 23 0 30-10-7-11-20 0-30z" fill="#3c853c"/><path d="M52 260v24M44 270l8 6M60 267l-8 8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="86" y="263" class="small green">Ecological</text><text x="86" y="278" class="small green">processes</text>
    <circle cx="52" cy="323" r="18" fill="#f3eef9" stroke="#72519c" stroke-width="2"/><path d="M42 334c12-26 24-26 21-2M49 314l12-9M57 314l-13-8" stroke="#72519c" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="61" cy="305" r="3" fill="#72519c"/>
    <text x="86" y="319" class="small purple">Multispecies</text><text x="86" y="334" class="small purple">co-existence</text>
    <circle cx="52" cy="380" r="18" fill="#fff2e5" stroke="#d9781f" stroke-width="2"/><path d="M39 376h26M43 376v15M51 376v15M59 376v15M38 393h28M52 365l15 9H37z" stroke="#d9781f" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
    <text x="86" y="372" class="small orange">Cultural-</text><text x="86" y="387" class="small orange">symbolic</text><text x="86" y="402" class="small orange">continuity</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="170" y="86" width="250" height="150" rx="8" fill="#f1f8ee" stroke="#3c853c" stroke-width="1.4"/>
    <rect x="467" y="86" width="270" height="150" rx="8" fill="#edf6ff" stroke="#2f72b7" stroke-width="1.4"/>
    <rect x="170" y="267" width="250" height="150" rx="8" fill="#fff0ee" stroke="#cf4b43" stroke-width="1.4"/>
    <rect x="467" y="267" width="270" height="150" rx="8" fill="#fff5e6" stroke="#d9781f" stroke-width="1.4"/>
  </g>

  <g class="sans">
    <text x="295" y="113" text-anchor="middle" class="qtitle green">Relational Persistence</text>
    <text x="295" y="134" text-anchor="middle" class="qsub green">Low material / High relational</text>
    <circle cx="219" cy="165" r="34" fill="#e3f1df" stroke="#3c853c" stroke-width="1.5"/>
    <path d="M197 183h43v8h-43zM203 164h9v19h-9zM218 153h10v30h-10zM234 168h8v15h-8z" fill="#4b8c42"/>
    <text x="257" y="157" class="body">Relational continuity is sustained</text>
    <text x="257" y="173" class="body">through social ties, ecological</text>
    <text x="257" y="189" class="body">practices, multispecies relations,</text>
    <text x="257" y="205" class="body">and cultural meanings.</text>
    <text x="257" y="224" class="italic">Relationships adapt despite limited material recovery.</text>

    <text x="602" y="113" text-anchor="middle" class="qtitle blue">Integrated Re-inhabitation</text>
    <text x="602" y="134" text-anchor="middle" class="qsub blue">High material / High relational</text>
    <circle cx="523" cy="165" r="34" fill="#dcecf8" stroke="#2f72b7" stroke-width="1.5"/>
    <path d="M501 185h46v8h-46zM507 157h10v28h-10zM523 143h12v42h-12zM540 166h9v19h-9zM527 153h4M527 163h4M510 166h4" stroke="#2f72b7" stroke-width="2" fill="none"/>
    <text x="561" y="157" class="body">Material reconstruction progresses</text>
    <text x="561" y="173" class="body">with the reassembly of social,</text>
    <text x="561" y="189" class="body">ecological, multispecies, and</text>
    <text x="561" y="205" class="body">cultural-symbolic relations.</text>
    <text x="561" y="224" class="italic">Material and relational systems co-evolve.</text>

    <text x="295" y="294" text-anchor="middle" class="qtitle red">Collapsed Recovery</text>
    <text x="295" y="315" text-anchor="middle" class="qsub red">Low material / Low relational</text>
    <circle cx="219" cy="347" r="34" fill="#fae1df" stroke="#cf4b43" stroke-width="1.5"/>
    <path d="M196 368h48v8h-48zM203 347l18-16 18 16v21h-36z" fill="#cf4b43"/><path d="M197 333l10 11M219 316v34M209 324l10 10M235 322v43M228 333l8 10M245 336l-10 8" stroke="#cf4b43" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="257" y="339" class="body">Material reconstruction and</text>
    <text x="257" y="355" class="body">relational reassembly both fail</text>
    <text x="257" y="371" class="body">to progress.</text>
    <text x="257" y="393" class="italic">Fragmentation and degradation reinforce uninhabitable conditions.</text>

    <text x="602" y="294" text-anchor="middle" class="qtitle orange">Disembedded Reconstruction</text>
    <text x="602" y="315" text-anchor="middle" class="qsub orange">High material / Low relational</text>
    <circle cx="523" cy="347" r="34" fill="#fff0da" stroke="#d9781f" stroke-width="1.5"/>
    <path d="M501 368h45M507 341h33v27h-33zM501 334h45M520 334v34M536 334v34M508 347h31M511 355h8M526 355h8M504 331l29-17 19 17" stroke="#d9781f" stroke-width="2.8" fill="none" stroke-linejoin="round"/>
    <text x="561" y="339" class="body">Physical reconstruction is achieved,</text>
    <text x="561" y="355" class="body">but relational systems remain weak,</text>
    <text x="561" y="371" class="body">fragmented, or excluded.</text>
    <text x="561" y="393" class="italic">Built environments are not fully inhabitable.</text>
  </g>

  <g class="sans">
    <circle cx="436" cy="252" r="47" fill="#fbf7ff" stroke="#72519c" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text x="436" y="232" text-anchor="middle" class="qtitle purple">Uneven</text>
    <text x="436" y="250" text-anchor="middle" class="qtitle purple">Relational</text>
    <text x="436" y="268" text-anchor="middle" class="qtitle purple">Reassembly</text>
    <text x="436" y="288" text-anchor="middle" class="body">Recovery is not linear</text>
    <text x="436" y="303" text-anchor="middle" class="body">or uniform.</text>
  </g>
  <g stroke="#364145" stroke-width="1.7" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow)">
    <path d="M420 219l-32-28"/><path d="M452 219l32-28"/><path d="M420 285l-32 28"/><path d="M452 285l32 28"/>
  </g>
</svg>
